[package]
name = "scada-gateway"
version = "0.5.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
async-opcua = { version = "0.19.0", features = ["client"] }
axum = "0.8.9"
chrono = { version = "0.4.45", features = ["serde"] }
const_format = "0.2.36"
flate2 = "1.1.10"
mlua = { version = "0.12.1", features = ["lua51", "vendored", "send"] }
prometheus = { version = "0.14.0", features = ["process"] }
# Аварии прошивки ptusa (разбор 103, строка 104) — общие с OPC UA-фасадом; лежат в его папке, см. их Cargo.toml.
ptusa-alarms = { path = "ptusa-opcua/ptusa-alarms" }
rdkafka = { version = "0.39.0", features = ["cmake-build", "ssl-vendored"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["raw_value"] }
serde_yaml_ng = "0.10.0"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-native-roots", "postgres", "migrate", "macros", "chrono"] }
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["full"] }
tokio-modbus = { version = "0.17.0", default-features = false, features = ["tcp"] }
tokio-util = "0.7.19"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.26.1", features = ["v4"] }

[dev-dependencies]
# Сервер OPC UA в процессе теста (tests/opcua_server.rs): строгий к типам, с пределом узлов в запросе. Только для тестов.
async-opcua = { version = "0.19.0", features = ["client", "server"] }
tokio = { version = "1", features = ["test-util"] }
tempfile = "3.27.0"

[profile.release]
strip = true
lto = "thin"

# Генерация RSA-ключа (сертификат OPC UA-клиента, тестовые серверы) без оптимизации идёт секунды на ключ: тесты
# сертификатов шли 45 с. Оптимизируется только арифметика RSA, остальной код отлаживается как обычно.
[profile.dev.package.num-bigint-dig]
opt-level = 3

[profile.dev.package.rsa]
opt-level = 3
