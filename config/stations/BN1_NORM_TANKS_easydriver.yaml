# ============================================================================
# Реальная станция BN1_NORM_TANKS (Барановичи-1): один контроллер ptusa, все каналы — PAC (driver-master), то есть по
# протоколу «EasyDriver»: тому, на котором драйвер старой SCADA (EasyServer) говорит с контроллером.
# СГЕНЕРИРОВАНО tools/station_to_easydriver.sh из config/stations/BN1_NORM_TANKS.yaml (тот же набор каналов, те же имена,
# типы и доступ на запись) — не править руками. Тот же набор по OPC UA — config/stations/BN1_NORM_TANKS.yaml.
# Адрес контроллера — env PAC_HOST, порт — PAC_PORT (10000 по умолчанию). IP объекта в репозиторий не пишется.
# ============================================================================
