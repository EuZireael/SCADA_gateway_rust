[package]
name = "simulator"
version = "0.1.0"
edition = "2024"
description = "PLC-симулятор для стенда шлюза: OPC UA, Modbus TCP и PAC (driver-master) в одном процессе, реплей архива BN1_MCA1"

# Отдельный пакет (как loadtest/loadsim): не входит в сборку шлюза и его образа.
[workspace]

[dependencies]
anyhow = "1"
async-opcua = { version = "0.19.0", features = ["server"] }
flate2 = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
