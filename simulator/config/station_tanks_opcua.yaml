# ============================================================================
# Симулятор станции: ВСЕ каналы базы каналов — по OPC UA (Modbus и PAC не поднимаются).
# СГЕНЕРИРОВАНО `simulator station-config opcua` из config/stations/BN1_NORM_TANKS.yaml и прежней трёхпротокольной
# конфигурации (replay_config.yaml) — не править руками: поправьте источник и пересоберите.
#   каналов 2740, включено в базе 2658; с прежним описанием (архив, правила прошивки) 11, новых (статических) 2729
# Адрес узла — ns=2;s=<прибор>.<поле>, как у OPC UA-фасада эмулятора мойки (ptusa-opcua/): шлюзу нужен один и тот же config/stations/*.yaml.
# Тот же набор каналов по другому протоколу: PAC — station_pac.yaml; три протокола (тесты) — replay_config.yaml.
# ============================================================================
