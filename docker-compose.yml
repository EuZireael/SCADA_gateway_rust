# ============================================================================
# Стенд Rust-шлюза одной командой: postgres + kafka + PLC-симулятор + шлюз. Все каналы базы каналов станции
# BN1_MCA1 отдаются симулятором и читаются шлюзом по OPC UA (config/stations/BN1_MCA1.yaml).
# Три протокола (OPC UA + Modbus + PAC) — конфигурации для тестов: simulator/config/replay_config.yaml.
#
#   docker compose up -d --build     # поднять (образы соберутся при первом запуске)
#   docker compose logs -f gateway   # логи шлюза
#   docker compose down              # остановить (данные БД сохранятся)
#   docker compose down -v           # остановить и стереть БД
#
# Порты на хост (те же, что у стенда Java-шлюза — одновременно их не поднимать):
#   8888 — HTTP шлюза (/actuator/health, /actuator/prometheus, /api/*)
#   9094 — Kafka для монитора и тестов
#   5433 — PostgreSQL
#   4840 — OPC UA симулятора: все каналы станции (2647) только по OPC UA, Modbus и PAC не поднимаются
# ============================================================================
name: scada-rs

services:
  postgres:
    image: postgres:16
    container_name: scada-rs-postgres
    environment:
      POSTGRES_DB: scada_db
      POSTGRES_USER: scada_user
      POSTGRES_PASSWORD: scada_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"   # БД стенда с паролем по умолчанию — только с этого хоста
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scada_user -d scada_db"]
      interval: 5s
      timeout: 5s
      retries: 15

  # Два listener'а: PLAINTEXT kafka:9092 — внутри сети (шлюз), EXTERNAL localhost:9094 — с хоста.
  kafka:
    image: apache/kafka:4.3.1
    container_name: scada-rs-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Горячее резервирование: падение активного шлюза замечается за session-timeout (2 c), а не за 6 c —
      # минимум брокера по умолчанию. На заводском брокере — та же настройка.
      KAFKA_GROUP_MIN_SESSION_TIMEOUT_MS: 1000
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms512m"
      CLUSTER_ID: scada-rs-cluster-01
    ports:
      - "127.0.0.1:9094:9094"   # Kafka без аутентификации; анонсируется как localhost:9094 — с других хостов не подключиться
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15

  # PLC-симулятор станции: все 2647 каналов базы каналов по OPC UA (simulator/config/station_opcua.yaml),
  # реплей 5-суточного архива BN1_MCA1. Modbus и PAC симулятор умеет, но здесь их теги не заданы — порты закрыты.
  simulator:
    build: ./simulator
    container_name: scada-rs-simulator
    environment:
      # Сервер анонсирует резолвимое в сети имя.
      OPCUA_ENDPOINT: "opc.tcp://simulator:4840"
    ports:
      - "4840:4840"
    healthcheck:
      test: ["CMD", "/app/simulator", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped

  gateway:
    build: .
    container_name: scada-rs-gateway
    environment:
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/scada_db"
      SPRING_DATASOURCE_USERNAME: "scada_user"
      SPRING_DATASOURCE_PASSWORD: "scada_password"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
      PLC_HOST: "simulator"
    volumes:
      - ./config/stations/BN1_MCA1.yaml:/app/config/controllers.yaml:ro
    ports:
      - "8888:8888"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      simulator:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  pgdata:
