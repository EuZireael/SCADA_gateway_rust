# ============================================================================
# CI/CD Rust-шлюза.
#   На каждый push и PR: форматирование, clippy (предупреждения = ошибки), тесты.
#   На push в main и теги vX.Y.Z: образ публикуется в GHCR.
#   На тег vX.Y.Z после зелёных тестов — GitHub Release с разделом CHANGELOG.md.
# ============================================================================
name: CI/CD

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:

# Токен задач только на чтение; кому нужно больше (публикация образа, Release), просит сам в своей задаче.
permissions:
  contents: read

# Имя образа в GHCR — явно, а не из имени репозитория: после переименования репозитория (SCADA_rust →
# SCADA_gateway_rust) образ остался прежним, у тех, кто его тянет, ничего не меняется. Только строчные буквы.
env:
  IMAGE: ghcr.io/euzireael/scada_rust

jobs:
  check:
    name: Rust fmt, clippy & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # librdkafka 2.12 включает curl/curl.h даже при выключенном curl: в config.h
      # WITH_OAUTHBEARER_OIDC определён всегда (cmakedefine01), а проверка — #ifdef.
      # Нужны только заголовки; линковки с libcurl нет.
      - name: Install native build deps
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libcurl4-openssl-dev

      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # Кэш ~/.cargo и target: librdkafka и Lua собираются из исходников, без кэша
      # это несколько минут на каждый прогон.
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Docs (битые ссылки в документации)
        run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --locked

  # PLC-симулятор на Rust (simulator/): реплей архива, регистры Modbus, PAC-сервер, конфигурация.
  simulator:
    name: Simulator (Rust fmt, clippy & test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: simulator
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: simulator
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --locked
      - name: Build image (smoke)
        run: docker build -t scada-simulator .

  # OPC UA-фасад эмулятора ptusa на Rust (ptusa-opcua/): снимок PAC, запись set_cmd, песочница Lua.
  ptusa-opcua:
    name: ptusa-opcua (Rust fmt, clippy & test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ptusa-opcua
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ptusa-opcua
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --locked
      - name: Build image (smoke)
        run: docker build -t ptusa-opcua .

  # Интеграционные тесты (#[ignore] в обычном cargo test): клиенты протоколов и шлюз
  # целиком против своего PLC-симулятора (simulator/), Kafka и Postgres.
  integration:
    name: Integration tests (simulator + Kafka + Postgres)
    needs: [check, simulator, ptusa-opcua]
    runs-on: ubuntu-latest
    services:
      kafka:
        image: apache/kafka:4.3.1       # KRaft, одна нода, PLAINTEXT localhost:9092; версия — как в docker-compose.yml
        ports: [ "9092:9092" ]
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: scada_it
          POSTGRES_USER: scada_user
          POSTGRES_PASSWORD: scada_password
        ports: [ "5432:5432" ]
        options: >-
          --health-cmd "pg_isready -U scada_user -d scada_it"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v7

      - name: Install native build deps
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libcurl4-openssl-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            simulator
            ptusa-opcua

      - name: Start PLC simulator
        run: |
          cargo build --release --locked --manifest-path simulator/Cargo.toml
          cd simulator
          SIM_OPCUA_USER=operator SIM_OPCUA_PASSWORD=operator-pass OPCUA_ENDPOINT=opc.tcp://127.0.0.1:4840 nohup ./target/release/simulator config/replay_config.yaml > "$RUNNER_TEMP/simulator.log" 2>&1 &
          for port in 4840 5020 10000; do
            for _ in $(seq 60); do (echo > /dev/tcp/127.0.0.1/$port) 2>/dev/null && break; sleep 1; done
          done
          for _ in $(seq 60); do (echo > /dev/tcp/127.0.0.1/9092) 2>/dev/null && break; sleep 1; done
          tail -3 "$RUNNER_TEMP/simulator.log"

      # Защищённый фасад поверх PAC симулятора: два пользователя (роли write и read), канал Basic256Sha256. Шлюз против него —
      # tests/facade_secure.rs.
      - name: Start secured OPC UA facade
        run: |
          cargo build --release --locked --manifest-path ptusa-opcua/Cargo.toml
          F=ptusa-opcua/target/release/ptusa-opcua
          printf 'anna %s write\nboris %s read\n' \
            "$(echo anna-pass | $F hash-password)" "$(echo boris-pass | $F hash-password)" > "$RUNNER_TEMP/opcua-users"
          PAC_HOST=127.0.0.1 PAC_PORT=10000 STATION_CONFIG=config/stations/BN1_MCA1.yaml \
            OPCUA_BIND=127.0.0.1:4870 OPCUA_ENDPOINT=opc.tcp://localhost:4870 \
            OPCUA_USERS_FILE="$RUNNER_TEMP/opcua-users" OPCUA_PKI_DIR="$RUNNER_TEMP/facade-pki" OPCUA_TRUST_ALL_CLIENTS=true \
            nohup $F > "$RUNNER_TEMP/facade.log" 2>&1 &
          for _ in $(seq 60); do (echo > /dev/tcp/127.0.0.1/4870) 2>/dev/null && break; sleep 1; done
          tail -3 "$RUNNER_TEMP/facade.log"

      - name: Правила записи PAC соответствуют конфигурации (simulator conformance)
        run: |
          cd simulator
          ./target/release/simulator conformance 127.0.0.1 10000 config/replay_config.yaml

      # Отдельный PostgreSQL с TLS и своим УЦ: проверка, что sslmode из адреса БД действует (tests/db_tls.rs).
      - name: Start PostgreSQL with TLS
        run: scripts/pg_tls.sh "$RUNNER_TEMP/pg-tls"

      - name: Integration tests
        env:
          SIM_HOST: 127.0.0.1
          KAFKA_BOOTSTRAP: localhost:9092
          IT_DATABASE_URL: jdbc:postgresql://localhost:5432/scada_it
          IT_DATABASE_TLS_URL: jdbc:postgresql://localhost:5434/scada_tls
          IT_DATABASE_TLS_CA: ${{ runner.temp }}/pg-tls/ca.crt
          # Сессия выборов резервирования: брокер service-контейнера с настройками по умолчанию
          # (любая переменная KAFKA_* отключает его конфиг по умолчанию) принимает не меньше 6 c.
          IT_HA_SESSION_MS: "6000"
          IT_FACADE_URL: opc.tcp://localhost:4870
          IT_FACADE_WRITER: anna:anna-pass
          IT_FACADE_READER: boris:boris-pass
        run: cargo test --locked -- --ignored

      - name: Logs on failure
        if: failure()
        run: |
          echo "=== simulator ==="; tail -50 "$RUNNER_TEMP/simulator.log" || true
          echo "=== facade ==="; tail -50 "$RUNNER_TEMP/facade.log" || true
          for f in /tmp/scada-gateway-it-*.log; do echo "=== $f ==="; tail -80 "$f"; done || true

  # Клиент OPC UA против независимого сервера (OPC PLC, стек OPC Foundation .NET), а не async-opcua, на котором построены
  # симулятор и фасад: строгость типов, пределы, защита, обрыв. См. tests/opcua_compat.rs и docs/DEVELOPMENT.md.
  compat:
    name: OPC UA против независимого сервера (OPC PLC)
    needs: [check]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install native build deps
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libcurl4-openssl-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Имя хоста контейнера — localhost: клиент шлюза проверяет имя в сертификате сервера, и адрес opc.tcp://localhost
      # должен в нём найтись.
      - name: Start OPC PLC
        run: |
          docker run -d --name compat-opcplc --hostname localhost -p 50000:50000 \
            -v "$PWD/tests/compat/opc_plc_nodes.json:/nodes/gateway.json:ro" \
            mcr.microsoft.com/iotedge/opc-plc:2.15.11 \
            --pn=50000 --aa --ut --nf=/nodes/gateway.json --sn=1200 --sr=3600 --st=uint --du=operator --dc=operator-pass
          for _ in $(seq 60); do (echo > /dev/tcp/127.0.0.1/50000) 2>/dev/null && break; sleep 1; done
          sleep 5

      - name: Compatibility tests
        env:
          COMPAT_OPCUA_URL: opc.tcp://localhost:50000
          COMPAT_OPCUA_CONTAINER: compat-opcplc
        run: cargo test --locked --test opcua_compat -- --ignored

      - name: Server log on failure
        if: failure()
        run: docker logs compat-opcplc 2>&1 | tail -80

  # Стенд целиком (docker-compose.yml: Kafka + Postgres + Rust-симулятор + Rust-шлюз, образы из исходников)
  # и сбои, которые бывают на объекте: пропал брокер, БД, ПЛК. См. scripts/stack_smoke.sh.
  stack:
    name: "Stack smoke (${{ matrix.mode }}, docker compose + сбои Kafka, БД, ПЛК)"
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        mode: [opcua, easydriver]   # как шлюз читает ту же станцию: OPC UA или PAC (EasyDriver)
    steps:
      - uses: actions/checkout@v7
      - run: MODE=${{ matrix.mode }} scripts/stack_smoke.sh

  # Производительность на масштабе стенда из контракта «по исключению»: 27 400 тегов (10 OPC UA-серверов ×
  # 2740, треть меняется каждую секунду), шлюз процессом, Kafka в Docker. Падает, если опрос отстаёт,
  # сообщения теряются или память растёт. См. scripts/load_check.sh и loadtest/README.md.
  load:
    name: Load check (27 400 тегов)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install native build deps
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libcurl4-openssl-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            loadtest/loadsim
      - run: scripts/load_check.sh

  docker:
    name: Build & publish image (GHCR)
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write          # право публиковать пакет в GHCR через GITHUB_TOKEN
    steps:
      - uses: actions/checkout@v7

      # Тег релиза должен совпадать с версией в Cargo.toml (её пишет в лог сам шлюз) —
      # иначе образ :vX.Y.Z содержал бы другую версию.
      - name: Check tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          [ "v$VERSION" = "$GITHUB_REF_NAME" ] || { echo "::error::тег $GITHUB_REF_NAME ≠ версия Cargo.toml $VERSION"; exit 1; }

      # На PR образ только собирается (проверка Dockerfile), публикуется на push.
      - name: Log in to GHCR
        if: github.event_name == 'push'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      # Теги образа:
      #   main       → :latest (+ :<sha>)
      #   тег vX.Y.Z → :vX.Y.Z (+ :<sha>)
      #   PR         → :ci-<sha> (не публикуется)
      # Имя образа — env.IMAGE в начале файла.
      - name: Compute image tags
        id: meta
        run: |
          case "${{ github.ref }}" in
            refs/heads/main) TAGS="$IMAGE:latest $IMAGE:${{ github.sha }}" ;;
            refs/tags/v*)    TAGS="$IMAGE:${{ github.ref_name }} $IMAGE:${{ github.sha }}" ;;
            *)               TAGS="$IMAGE:ci-${{ github.sha }}" ;;
          esac
          ARGS=""; for t in $TAGS; do ARGS="$ARGS -t $t"; done
          # OCI-метки: GHCR привязывает пакет к репозиторию, по образу видно версию и коммит.
          case "${{ github.ref }}" in refs/tags/v*) VERSION="${{ github.ref_name }}" ;; *) VERSION="${{ github.sha }}" ;; esac
          ARGS="$ARGS --label org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}"
          ARGS="$ARGS --label org.opencontainers.image.revision=${{ github.sha }}"
          ARGS="$ARGS --label org.opencontainers.image.version=$VERSION"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "args=$ARGS" >> "$GITHUB_OUTPUT"

      - name: Build image
        run: docker build ${{ steps.meta.outputs.args }} .

      - name: Push image
        if: github.event_name == 'push'
        run: docker push -a ${{ steps.meta.outputs.image }}

  # Тег vX.Y.Z → GitHub Release: текст — раздел этой версии из CHANGELOG.md, плюс команда
  # для образа. Только после зелёных интеграционных тестов и публикации образа.
  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [integration, docker, stack, load, compat]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Release notes from CHANGELOG.md
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" 'index($0, "## [" v "]") == 1 {on=1; next} on && /^## \[/ {exit} on' CHANGELOG.md > notes.md
          grep -q '[^[:space:]]' notes.md || { echo "::error::в CHANGELOG.md нет раздела [$VERSION]"; exit 1; }
          { echo; echo '---'; echo; echo "Образ: \`docker pull $IMAGE:$GITHUB_REF_NAME\`"; } >> notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
